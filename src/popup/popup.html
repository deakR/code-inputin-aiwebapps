<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Input for AI Chat</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Code Input for AI Chat</h1>
      <p class="sub">A real code editor for AI prompt boxes.</p>
    </header>

    <section class="group">
      <label class="row">
        <span>Default language</span>
        <select id="language"></select>
      </label>
      <label class="row">
        <span>Show code button</span>
        <input type="checkbox" id="launcher" />
      </label>
      <label class="row">
        <span>Button placement</span>
        <select id="placement">
          <option value="auto">In the composer</option>
          <option value="floating">Floating corner</option>
        </select>
      </label>
      <label class="row">
        <span>Shortcut</span>
        <select id="shortcut">
          <option value="Ctrl+Shift+E">Ctrl+Shift+E</option>
          <option value="Ctrl+Shift+K">Ctrl+Shift+K</option>
          <option value="Ctrl+Shift+C">Ctrl+Shift+C</option>
          <option value="Ctrl+Shift+Space">Ctrl+Shift+Space</option>
          <option value="Alt+Shift+C">Alt+Shift+C</option>
          <option value="Alt+Shift+E">Alt+Shift+E</option>
          <option value="Alt+Shift+K">Alt+Shift+K</option>
        </select>
      </label>
    </section>

    <section class="group">
      <div class="status">
        <div class="status-row"><span>This page</span><strong id="status-site">Checking…</strong></div>
        <div class="status-row"><span>Prompt box</span><strong id="status-input">—</strong></div>
        <div class="status-row"><span>Launcher</span><strong id="status-launcher">—</strong></div>
        <div class="status-row"><span>Send button</span><strong id="status-send">—</strong></div>
      </div>
      <div class="actions">
        <button type="button" id="pick">Pick prompt box</button>
        <button type="button" id="open-editor">Open editor</button>
        <button type="button" id="diag">Refresh</button>
      </div>
      <p class="note" id="status-note"></p>
    </section>

    <footer>
      <p class="version" id="version"></p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
