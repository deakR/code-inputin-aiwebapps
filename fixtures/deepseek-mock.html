<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="gci-site" content="deepseek" />
    <title>DeepSeek mock — prompt box fixture</title>
    <link rel="stylesheet" href="site-mock.css" />
  </head>
  <body>
    <main id="conversation"></main>
    <div id="composer">
      <form class="composer-form">
        <textarea
          id="prompt-input"
          class="editor"
          rows="1"
          placeholder="Message DeepSeek"
          aria-label="Message DeepSeek"
        ></textarea>
        <div class="actions">
          <button type="button" class="attach" aria-label="Attach files">+</button>
          <span class="spacer"></span>
          <button type="button" id="send-button" class="send" aria-label="Send" disabled>➤</button>
        </div>
      </form>
    </div>
    <script src="site-mock.js"></script>
  </body>
</html>
