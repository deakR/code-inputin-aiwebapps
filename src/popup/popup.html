<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Code Input</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Gemini Code Input</h1>
      <p class="sub">A real code editor for Gemini's prompt box.</p>
    </header>

    <section class="status" aria-live="polite">
      <span class="dot" id="dot"></span>
      <span id="status">Checking this tab…</span>
    </section>

    <button id="open" class="primary" hidden>Open the code editor</button>

    <section class="group">
      <label class="row">
        <span>Default language</span>
        <select id="language"></select>
      </label>
      <label class="row">
        <span>Wrap code in a fence</span>
        <input type="checkbox" id="fence" />
      </label>
      <label class="row">
        <span>Wrap long lines</span>
        <input type="checkbox" id="wrap" />
      </label>
      <label class="row">
        <span>Floating button</span>
        <input type="checkbox" id="launcher" />
      </label>
      <label class="row">
        <span>Button position</span>
        <select id="position">
          <option value="above-left">Above, left</option>
          <option value="inside-left">Inside the box, left</option>
          <option value="inside-right">Inside the box, right</option>
          <option value="fixed-bottom-right">Screen bottom right</option>
        </select>
      </label>
      <label class="row">
        <span>Editor height <em id="height-value">340 px</em></span>
        <input type="range" id="height" min="180" max="760" step="20" />
      </label>
      <p class="hint">In the prompt box the editor grows with your code; this is
        the height at which it starts scrolling (and the size of the floating panel).</p>
    </section>

    <footer>
      <p class="kbd">
        <kbd id="shortcut">Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>E</kbd> toggles the editor
      </p>
      <p class="diag" id="diag"></p>
      <p class="version" id="version"></p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
