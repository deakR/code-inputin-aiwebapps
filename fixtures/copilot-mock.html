<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="gci-site" content="copilot" />
    <title>Copilot mock — prompt box fixture</title>
    <link rel="stylesheet" href="site-mock.css" />
  </head>
  <body>
    <main id="conversation"></main>
    <div id="shadow-app"></div>
    <script>
      (function () {
        var host = document.getElementById('shadow-app');
        var root = host.attachShadow({ mode: 'open' });
        root.innerHTML =
          '<style>' +
          'form{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid #d0d5dd;border-radius:18px;background:#fff;font:14px/1.5 system-ui,sans-serif}' +
          '.editor{width:100%;min-height:28px;border:0;outline:0;resize:none;font:13px/1.5 ui-monospace,monospace;background:transparent}' +
          '.actions{display:flex;align-items:center;gap:8px}' +
          '.spacer{flex:1}' +
          'button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer}' +
          '#send-button{background:#1a73e8;color:#fff}' +
          '#send-button:disabled{background:#e4e7ec;color:#98a2b3}' +
          '</style>' +
          '<form>' +
          '<textarea id="prompt-input" class="editor" rows="1" data-testid="composer-input" placeholder="Message Copilot" aria-label="Message Copilot"></textarea>' +
          '<div class="actions"><button type="button" class="attach" aria-label="Attach files">+</button><span class="spacer"></span><button type="button" id="send-button" class="send" aria-label="Submit" disabled>➤</button></div>' +
          '</form>';
      })();
    </script>
    <script src="site-mock.js"></script>
  </body>
</html>
