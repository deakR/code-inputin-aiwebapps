<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="gci-site" content="perplexity" />
    <title>Perplexity mock — prompt box fixture</title>
    <link rel="stylesheet" href="site-mock.css" />
  </head>
  <body>
    <main id="conversation"></main>
    <div id="composer">
      <form class="composer-form">
        <div
          id="prompt-input"
          class="editor"
          contenteditable="true"
          role="textbox"
          aria-label="Ask anything"
          data-placeholder="Ask anything"
        ></div>
        <div class="actions">
          <button type="button" class="attach" aria-label="Attach files">+</button>
          <span class="spacer"></span>
          <button type="button" id="send-button" class="send" aria-label="Submit" disabled>➤</button>
        </div>
      </form>
    </div>
    <script src="site-mock.js"></script>
  </body>
</html>
