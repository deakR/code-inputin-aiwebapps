<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Code Input</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Gemini Code Input</h1>
      <p class="sub">A real code editor for Gemini's prompt box.</p>
    </header>

    <section class="group">
      <label class="row">
        <span>Default language</span>
        <select id="language"></select>
      </label>
      <label class="row">
        <span>Show floating button</span>
        <input type="checkbox" id="launcher" />
      </label>
      <label class="row">
        <span>Button position</span>
        <select id="position">
          <option value="above-left">Above, left</option>
          <option value="inside-left">Inside the box, left</option>
          <option value="inside-right">Inside the box, right</option>
          <option value="fixed-bottom-right">Screen bottom right</option>
        </select>
      </label>
      <label class="row">
        <span>Shortcut</span>
        <select id="shortcut">
          <option value="Ctrl+Shift+E">Ctrl+Shift+E</option>
          <option value="Ctrl+Shift+K">Ctrl+Shift+K</option>
          <option value="Ctrl+Shift+C">Ctrl+Shift+C</option>
          <option value="Ctrl+Shift+Space">Ctrl+Shift+Space</option>
          <option value="Alt+Shift+C">Alt+Shift+C</option>
          <option value="Alt+Shift+E">Alt+Shift+E</option>
          <option value="Alt+Shift+K">Alt+Shift+K</option>
        </select>
      </label>
    </section>

    <footer>
      <p class="version" id="version"></p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
